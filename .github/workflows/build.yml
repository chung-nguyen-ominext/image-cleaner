name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ImageCleaner-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux GUI/runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
      - name: Locate Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found on this runner" }
          $iscc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Cache LaMa model
        uses: actions/cache@v4
        with:
          path: models/lama/lama_fp32.onnx
          key: lama-fp32-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python scripts/fetch_models.py
      - name: Test
        env:
          QT_SCALE_FACTOR: "1"
        run: python -m pytest -q
      - name: Build + verify + package
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ImageCleaner-${{ matrix.name }}
          path: |
            dist/ImageCleaner-*.tar.gz
            dist/ImageCleaner-*.deb
            dist/ImageCleaner-*.zip
            dist/ImageCleaner-*.dmg
            dist/ImageCleaner-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
