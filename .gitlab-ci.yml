# GitLab CI/CD - native builds for Linux, Windows and macOS.
#
# Linux and Windows use GitLab.com hosted runners (Free tier is enough).
# macOS hosted runners are Beta and require Premium/Ultimate, so that job is
# manual. GitLab.com only offers Apple Silicon macOS runners; for the Intel
# (x64) DMG use GitHub Actions or a native Intel Mac.

stages:
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key: imagecleaner
  paths:
    - .cache/pip
    - models/lama/lama_fp32.onnx

.rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

linux-x64:
  stage: build
  image: ubuntu:22.04
  extends: .rules
  timeout: 3h
  before_script:
    - apt-get update
    - apt-get install -y software-properties-common
    - add-apt-repository -y ppa:deadsnakes/ppa
    - apt-get update
    - apt-get install -y python3.12 python3.12-venv python3.12-dev libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0
    - python3.12 -m venv .venv
    - . .venv/bin/activate
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install --no-deps -e .
    - python scripts/fetch_models.py
    - python -m pytest -q
    - python scripts/build_release.py
  artifacts:
    paths:
      - dist/ImageCleaner-*.tar.gz
      - dist/ImageCleaner-*.deb
    expire_in: 14 days

windows-x64:
  stage: build
  tags:
    - saas-windows-medium-amd64
  extends: .rules
  timeout: 3h
  before_script:
    - choco install python312 innosetup --no-progress -y
    - $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
    - python --version
    - python -m venv .venv
  script:
    - .\.venv\Scripts\python.exe -m pip install --upgrade pip
    - .\.venv\Scripts\python.exe -m pip install -r requirements.txt
    - .\.venv\Scripts\python.exe -m pip install --no-deps -e .
    - .\.venv\Scripts\python.exe scripts\fetch_models.py
    - .\.venv\Scripts\python.exe -m pytest -q
    - .\.venv\Scripts\python.exe scripts\build_release.py
  artifacts:
    paths:
      - dist/ImageCleaner-*.zip
      - dist/ImageCleaner-Setup-*.exe
    expire_in: 14 days

macos-arm64:
  stage: build
  tags:
    - saas-macos-medium-m1
  image: macos-27-xcode-27
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  allow_failure: true
  timeout: 3h
  variables:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  before_script:
    - brew install python@3.12
    - '$(brew --prefix python@3.12)/bin/python3.12 -m venv .venv'
    - . .venv/bin/activate
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install --no-deps -e .
    - python scripts/fetch_models.py
    - python -m pytest -q
    - python scripts/build_release.py
  artifacts:
    paths:
      - dist/ImageCleaner-*.dmg
    expire_in: 14 days
